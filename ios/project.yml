name: PadCode
options:
  bundleIdPrefix: com.mashburnkansana
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # The widget extension's versions must match the app's.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # 0.5.2 with a layout fix (vendor/Runestone/PADCODE.md). Also replaces the
  # copy TreeSitterLanguages asks for.
  Runestone:
    path: ../vendor/Runestone
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    exactVersion: 0.1.10
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.0
targets:
  PadCode:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: Generated/padcore.swift
      - path: Assets.xcassets
      # Flat into the bundle root (a top-level "Resources" dir breaks iOS bundles);
      # themes/ stays a folder for Bundle.url(forResource:subdirectory:"themes").
      - path: Resources
        excludes: ["themes/**"]
        buildPhase: resources
      - path: Resources/themes
        type: folder
        buildPhase: resources
      # Linux on the iPad: Alpine's root filesystem (build-linux.sh), copied out on first use.
      - path: Generated/linux-root
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Generated/PadCoreFFI.xcframework
        embed: false
      # The iSH kernel (vendor/ish, GPLv3) and PadCode's shim; module PadLinux.
      - framework: Generated/LinuxKernel.xcframework
        embed: false
      - package: Runestone
      - package: SwiftTerm
      - package: TreeSitterLanguages
        products: [TreeSitterBashRunestone, TreeSitterCRunestone, TreeSitterCPPRunestone, TreeSitterCSSRunestone,
                   TreeSitterCSharpRunestone, TreeSitterGoRunestone, TreeSitterHTMLRunestone, TreeSitterJSONRunestone,
                   TreeSitterJavaRunestone, TreeSitterJavaScriptRunestone, TreeSitterLuaRunestone,
                   TreeSitterMarkdownRunestone, TreeSitterPHPRunestone, TreeSitterPythonRunestone,
                   TreeSitterRubyRunestone, TreeSitterRustRunestone, TreeSitterSQLRunestone, TreeSitterSwiftRunestone,
                   TreeSitterTOMLRunestone, TreeSitterTSXRunestone, TreeSitterTypeScriptRunestone,
                   TreeSitterYAMLRunestone]
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - target: PadCodeWidgets
    info:
      path: Generated/Info-PadCode.plist
      properties:
        # For the shared keychain group (WidgetData.swift).
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        # padcode://open?machine=<id>, from the widget.
        CFBundleURLTypes:
          - CFBundleURLName: com.mashburnkansana.padcode
            CFBundleURLSchemes: [padcode]
        # Launch on the canvas colour (light or dark), not a white or black flash.
        UILaunchScreen:
          UIColorName: Canvas
    entitlements:
      path: Generated/PadCode.entitlements
      properties:
        # The first group stays the default, where the existing items live.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.mashburnkansana.padcode
          - $(AppIdentifierPrefix)com.mashburnkansana.padcode.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashburnkansana.padcode
        PRODUCT_NAME: PadCode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T3Z3SP2L9U
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PadCode
        # SSH desktops on the local network (tunnels go through the internet and don't need it).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: PadCode connects to the computers you add as SSH hosts on your network.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        OTHER_LDFLAGS: "-lc++ -lsqlite3 -lresolv"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Rust core is built for arm64 only (Apple-silicon simulators and iPads).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        # Strip the symbol table (~75k entries, mostly Rust and tree-sitter). UIKit's
        # keyboard code calls dladdr on every caret move, and dladdr scans it
        # linearly, which was most of each keystroke's cost on the iPad. Crash logs
        # still symbolicate from the dSYM.
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          COPY_PHASE_STRIP: YES
  # Home Screen widget: machines and which are online.
  PadCodeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Generated/Info-Widgets.plist
      properties:
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.mashburnkansana.padcode.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashburnkansana.padcode.widgets
        PRODUCT_NAME: PadCodeWidgets
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T3Z3SP2L9U
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PadCode
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
